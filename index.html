<!doctype html><html><head><meta charset="utf-8"><title>Aegis - Fleet Control</title>
<style>
  :root{--bg:#0d0d0d;--panel:#161616;--line:#2a2a2a;--dim:#888;--text:#e8e8e8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header h1{font-size:18px;margin:0;color:#c9a227}
  header .sub{color:var(--dim);font-size:12px}
  header button{margin-left:auto;background:#1e1e1e;border:1px solid var(--line);color:#aaa;border-radius:6px;padding:6px 14px;cursor:pointer}
  .wrap{padding:20px;display:grid;grid-template-columns:1fr;gap:20px;max-width:1100px;margin:0 auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 10px}
  .fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent,#444);border-radius:8px;padding:14px}
  .card .top{display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:#555;flex-shrink:0}
  .dot.ok{background:#22c55e}.dot.bad{background:#ef4444}
  .card .name{font-weight:600;font-size:16px}
  .card .badge{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 7px;text-transform:uppercase}
  .card .row{margin-top:8px;color:var(--dim);font-size:12px;font-family:monospace;display:flex;align-items:center;gap:8px}
  .swatch{width:14px;height:14px;border-radius:50%;border:1px solid #444;display:inline-block}
  .console{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
  .console .lock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  select,input{background:#0f0f0f;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 10px;font-family:monospace}
  .palette{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .pchip{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid #0d0d0d;box-shadow:0 0 0 1px #444}
  .raw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .raw input.path{flex:1;min-width:160px}
  button.send{background:#c9a227;border:0;border-radius:6px;color:#0d0d0d;font-weight:600;padding:7px 16px;cursor:pointer}
  .log{margin-top:14px;background:#0a0a0a;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:monospace;font-size:12px;max-height:320px;overflow:auto}
  .log .line{padding:3px 0;border-bottom:1px solid #161616;white-space:pre-wrap;word-break:break-word}
  .log .agent{font-weight:700}
  .log .st-ok{color:#22c55e}.log .st-bad{color:#ef4444}
  .muted{color:var(--dim)}
</style></head><body>
<header>
  <h1>&#9678; Aegis</h1><span class="sub">fleet control plane &middot; local</span>
  <button onclick="loadFleet()">Refresh fleet</button>
</header>
<div class="wrap">
  <section>
    <h2>Fleet</h2>
    <div class="fleet" id="fleet"><span class="muted">loading&hellip;</span></div>
  </section>
  <section class="console">
    <h2>Target-locked console</h2>
    <div class="lock">
      <span class="muted">target:</span>
      <select id="target"></select>
      <span class="muted" id="targetHost"></span>
    </div>
    <div><span class="muted">set color:</span><div class="palette" id="palette"></div></div>
    <div class="raw">
      <span class="muted">raw:</span>
      <select id="method"><option>GET</option><option>POST</option></select>
      <input class="path" id="path" placeholder="/color  or  /model  or  /pending" value="/color">
      <input class="body" id="body" placeholder='body JSON (POST), e.g. {"value":"amber"}' style="flex:1;min-width:200px">
      <button class="send" onclick="sendRaw()">Send</button>
    </div>
    <div class="log" id="log"></div>
  </section>
</div>
<script>
let AGENTS = [], PALETTE = {};
const $ = s => document.querySelector(s);

async function api(agent, method, path, body){
  const r = await fetch('/api/call/'+encodeURIComponent(agent), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({method, path, body: body ?? null})
  });
  return r.json(); // {status, body}
}
function accentOf(agent){ const a=AGENTS.find(x=>x.name===agent); return (a&&a._accent)||'#c9a227'; }
function log(agent, method, path, res){
  const ok = res.status>=200 && res.status<300;
  let short = (res.body||'').slice(0,300);
  const el = document.createElement('div'); el.className='line';
  el.innerHTML = '<span class="agent" style="color:'+accentOf(agent)+'">&rarr; '+agent.toUpperCase()+'</span> '
    + '<span class="muted">'+method+' '+path+'</span> '
    + '<span class="'+(ok?'st-ok':'st-bad')+'">'+res.status+'</span> '
    + '<span class="muted">'+short.replace(/</g,'&lt;')+'</span>';
  $('#log').prepend(el);
}

async function loadFleet(){
  AGENTS = await (await fetch('/api/agents')).json();
  // target dropdown
  $('#target').innerHTML = AGENTS.map(a=>'<option>'+a.name+'</option>').join('');
  $('#target').onchange = ()=>{ const a=AGENTS.find(x=>x.name===$('#target').value); $('#targetHost').textContent = a? a.host : ''; };
  $('#target').onchange();
  // render + probe each agent
  $('#fleet').innerHTML = '';
  for(const a of AGENTS){
    const card = document.createElement('div'); card.className='card'; card.id='card-'+a.name;
    card.innerHTML = '<div class="top"><span class="dot" id="dot-'+a.name+'"></span>'
      + '<span class="name" id="nm-'+a.name+'">'+a.name+'</span>'
      + '<span class="badge">'+a.profile+'</span></div>'
      + '<div class="row" id="rc-'+a.name+'">probing&hellip;</div>'
      + '<div class="row" id="rx-'+a.name+'"></div>';
    $('#fleet').appendChild(card);
    probe(a);
  }
}

async function probe(a){
  const color = await api(a.name,'GET','/color');
  const dot=$('#dot-'+a.name), rc=$('#rc-'+a.name), card=$('#card-'+a.name);
  const ok = color.status===200;
  dot.className = 'dot '+(ok?'ok':'bad');
  if(ok){
    try{
      const j = JSON.parse(color.body);
      a._accent = j.accent; PALETTE = j.palette || PALETTE;
      card.style.setProperty('--accent', j.accent);
      $('#nm-'+a.name).style.color = j.accent;
      rc.innerHTML = '<span class="swatch" style="background:'+j.accent+'"></span> accent '+j.accent+' &middot; reachable';
      renderPalette();
    }catch(e){ rc.textContent = 'reachable (unparsed color)'; }
  } else {
    rc.innerHTML = '<span class="st-bad">unreachable / auth failed (HTTP '+color.status+')</span> '+(color.body||'').slice(0,80);
  }
  // castor extras: model + pending count
  if(a.profile==='castor' && ok){
    const rx=$('#rx-'+a.name);
    const [model,pending] = await Promise.all([api(a.name,'GET','/model'), api(a.name,'GET','/pending')]);
    let parts=[];
    try{ const p=JSON.parse(pending.body); const n=Array.isArray(p)?p.length:(p.items?p.items.length:(p.count??'?')); parts.push('pending: '+n); }catch{}
    if(model.status===200) parts.push('model: ok');
    rx.textContent = parts.join('  \u00b7  ');
  }
}

function renderPalette(){
  const el=$('#palette'); if(el.children.length) return;
  el.innerHTML = Object.entries(PALETTE).map(([n,hex])=>
    '<span class="pchip" title="'+n+'" style="background:'+hex+'" onclick="setColor(\''+n+'\')"></span>').join('');
}
async function setColor(name){
  const t=$('#target').value;
  const res = await api(t,'POST','/color',{value:name});
  log(t,'POST','/color {value:'+name+'}',res);
  probe(AGENTS.find(x=>x.name===t)); // refresh that card
}
async function sendRaw(){
  const t=$('#target').value, method=$('#method').value, path=$('#path').value.trim();
  let body=null; const bt=$('#body').value.trim();
  if(bt){ try{ body=JSON.parse(bt);}catch{ alert('body is not valid JSON'); return; } }
  const res = await api(t, method, path, body);
  log(t, method, path, res);
}
loadFleet();
</script></body></html>
